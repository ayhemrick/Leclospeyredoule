name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Values used only by the throwaway CI database and test settings.
  POSTGRES_USER: peyredoule
  POSTGRES_PASSWORD: peyredoule
  POSTGRES_DB: peyredoule
  APP_SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration-0000
  ADMIN_EMAIL: admin@clos-peyredoule.fr
  ADMIN_PASSWORD: CiPassword!2026
  PUBLIC_BASE_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173
  VITE_API_BASE_URL: http://localhost:8000

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: peyredoule
          POSTGRES_PASSWORD: peyredoule
          POSTGRES_DB: peyredoule
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peyredoule"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app

      - name: Check migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://peyredoule:peyredoule@localhost:5432/peyredoule
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://peyredoule:peyredoule@localhost:5432/peyredoule_test
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: peyredoule
          POSTGRES_PASSWORD: peyredoule
          POSTGRES_DB: peyredoule
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peyredoule"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://peyredoule:peyredoule@localhost:5432/peyredoule
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API did not start"; exit 1

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          E2E_ADMIN_PASSWORD: CiPassword!2026
        run: npx playwright test --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: clos-peyredoule-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: clos-peyredoule-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: clos-peyredoule-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publish scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
