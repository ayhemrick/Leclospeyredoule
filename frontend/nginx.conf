server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site is a single-page app: every unknown path is a client route,
    # including the /a/<code> deep link a phone camera opens.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The photographs do change when the owner replaces them.
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
