# Development stack: `docker compose up` gives you the database, the API and
# the site with hot reload on both. Production images are built from the same
# Dockerfiles with `--target runtime`.
name: clos-peyredoule

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peyredoule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peyredoule}
      POSTGRES_DB: ${POSTGRES_DB:-peyredoule}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 expects the volume one level up, so pg_upgrade --link works.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peyredoule} -d ${POSTGRES_DB:-peyredoule}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: builder
    command: >-
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-peyredoule}:${POSTGRES_PASSWORD:-peyredoule}@db:5432/${POSTGRES_DB:-peyredoule}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clos-peyredoule.fr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Proprietaire}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - api-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web-modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  api-venv:
  web-modules:
